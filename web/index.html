<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Paiva Tech</title>

    <link rel="stylesheet" href="./assets/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="sidebar-logo">

                    <div class="sidebar-icon">

                        <i class="fa-solid fa-motorcycle"></i>

                    </div>

                    <span>
                        PAIVA TECH
                    </span>

                </div>

                <nav class="sidebar-menu">

                    <a href="#" class="active">

                        <i class="fa-solid fa-chart-line"></i>

                        Dashboard

                    </a>

                    <a href="./pages/veiculos.html">

                        <i class="fa-solid fa-car-side"></i>

                        Veículos

                    </a>

                    <a href="./pages/vendas.html">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Vendas

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-wallet"></i>

                        Financeiro

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-users"></i>

                        Clientes

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-file-invoice-dollar"></i>

                        Parcelas

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-chart-pie"></i>

                        Relatórios

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-gear"></i>

                        Configurações

                    </a>

                </nav>

            </div>

            <button class="logout-btn" id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Sair

            </button>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <!-- TOPBAR -->

            <div class="topbar">

                <div>

                    <h1 class="page-title">
                        Dashboard
                    </h1>

                    <p class="page-subtitle">
                        Painel geral da concessionária
                    </p>

                </div>

                <div class="topbar-user">

                    <i class="fa-solid fa-user"></i>

                    <span id="usuarioNome">
                        Usuário
                    </span>

                </div>

            </div>

            <!-- KPIs -->

            <div class="cards-grid">

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Veículos em estoque
                        </span>

                        <h2 id="totalVeiculos">
                            0
                        </h2>

                    </div>

                    <i class="fa-solid fa-car-side card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Veículos vendidos
                        </span>

                        <h2 id="veiculosVendidos">
                            0
                        </h2>

                    </div>

                    <i class="fa-solid fa-circle-check card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Veículos consignados
                        </span>

                        <h2 id="veiculosConsignados">
                            0
                        </h2>

                    </div>

                    <i class="fa-solid fa-handshake card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Entradas
                        </span>

                        <h2 id="totalEntradas">
                            R$ 0,00
                        </h2>

                    </div>

                    <i class="fa-solid fa-arrow-trend-up card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Saldo atual
                        </span>

                        <h2 id="saldo">
                            R$ 0,00
                        </h2>

                    </div>

                    <i class="fa-solid fa-wallet card-icon"></i>

                </div>

            </div>

            <!-- GRÁFICOS -->

            <div class="charts-grid">

                <div class="chart-card">

                    <h3>
                        Fluxo financeiro
                    </h3>

                    <canvas id="financeiroChart"></canvas>

                </div>

                <div class="chart-card">

                    <h3>
                        Status dos veículos
                    </h3>

                    <canvas id="veiculosChart"></canvas>

                </div>

            </div>

        </main>

    </div>

    <script src="./assets/js/dashboard.js"></script>

</body>

</html>

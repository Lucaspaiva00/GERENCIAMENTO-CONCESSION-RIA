<!-- pages/financeiro.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financeiro | Paiva Tech</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="sidebar-logo">

                    <div class="sidebar-icon">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>

                    <span>PAIVA TECH</span>

                </div>

                <nav class="sidebar-menu">

                    <a href="#" class="active">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </a>

                    <a href="./pages/veiculos.html">
                        <i class="fa-solid fa-car-side"></i>
                        Veículos
                    </a>

                    <a href="./pages/vendas.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Vendas
                    </a>
                    <a href="./pages/vendedores.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Comissões
                    </a>

                    <a href="./pages/financeiro.html">
                        <i class="fa-solid fa-wallet"></i>
                        Financeiro
                    </a>

                    <a href="./pages/clientes.html">
                        <i class="fa-solid fa-users"></i>
                        Clientes
                    </a>

                    <a href="./pages/relatorios.html">
                        <i class="fa-solid fa-chart-pie"></i>
                        Relatórios
                    </a>

                    <a href="./pages/usuarios.html">
                        <i class="fa-solid fa-user"></i>
                        Cadastrar Vendedor
                    </a>
                </nav>

            </div>

            <button class="logout-btn" id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>
                Sair

            </button>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <div class="topbar">

                <div>

                    <h1 class="page-title">
                        Financeiro
                    </h1>

                    <p class="page-subtitle">
                        Controle financeiro completo
                    </p>

                </div>

                <button class="btn-primary" onclick="abrirModal()">

                    <i class="fa-solid fa-plus"></i>
                    Nova movimentação

                </button>

            </div>

            <!-- KPIS -->

            <div class="cards-grid">

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Entradas
                        </span>

                        <h2 id="totalEntradas">
                            R$ 0,00
                        </h2>

                    </div>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Saídas
                        </span>

                        <h2 id="totalSaidas">
                            R$ 0,00
                        </h2>

                    </div>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Saldo
                        </span>

                        <h2 id="saldoTotal">
                            R$ 0,00
                        </h2>

                    </div>

                </div>

            </div>

            <!-- GRAFICOS -->

            <div class="charts-grid">

                <div class="chart-card">

                    <h3>
                        Fluxo Financeiro
                    </h3>

                    <canvas id="financeiroChart"></canvas>

                </div>

                <div class="chart-card">

                    <h3>
                        Distribuição
                    </h3>

                    <canvas id="tipoChart"></canvas>

                </div>

            </div>

            <!-- FILTROS -->

            <div class="filters-card">

                <input type="text" class="filter-input" placeholder="Buscar descrição..." id="buscaInput">

                <select class="filter-input" id="tipoFiltro">

                    <option value="">
                        Todos
                    </option>

                    <option value="ENTRADA">
                        Entrada
                    </option>

                    <option value="SAIDA">
                        Saída
                    </option>

                </select>

            </div>

            <!-- TABELA -->

            <div class="table-card">

                <table class="custom-table">

                    <thead>

                        <tr>

                            <th>Descrição</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Vencimento</th>
                            <th>Data</th>

                        </tr>

                    </thead>

                    <tbody id="financeiroTable">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <!-- MODAL -->

    <div class="modal-overlay" id="modalFinanceiro">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Nova Movimentação
                </h2>

                <button onclick="fecharModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <form id="formFinanceiro">

                <div class="form-grid">

                    <input type="text" placeholder="Descrição" id="descricao" required>

                    <select id="tipo" required>

                        <option value="">
                            Tipo
                        </option>

                        <option value="ENTRADA">
                            Entrada
                        </option>

                        <option value="SAIDA">
                            Saída
                        </option>

                    </select>

                    <input type="number" placeholder="Valor" id="valor" required>

                    <select id="status">

                        <option value="PAGO">
                            Pago
                        </option>

                        <option value="PENDENTE">
                            Pendente
                        </option>

                    </select>

                    <input type="date" id="vencimento">

                </div>

                <button class="btn-primary full">

                    Salvar movimentação

                </button>

            </form>

        </div>

    </div>

    <script src="../assets/js/relatorios.js"></script>

</body>

</html>

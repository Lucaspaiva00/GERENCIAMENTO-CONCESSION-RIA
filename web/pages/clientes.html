<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="sidebar-logo">

                    <div class="sidebar-icon">
                        <i class="fa-solid fa-motorcycle"></i>
                    </div>

                    <span>
                        PAIVA TECH
                    </span>

                </div>

                <nav class="sidebar-menu">

                    <a href="../index.html">

                        <i class="fa-solid fa-chart-line"></i>

                        Dashboard

                    </a>

                    <a href="./pages/veiculos.html">

                        <i class="fa-solid fa-car-side"></i>

                        Veículos

                    </a>

                    <a href="./pages/vendas.html">

                        <i class="fa-solid fa-cart-shopping"></i>

                        Vendas

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-wallet"></i>

                        Financeiro

                    </a>

                    <a href="pages/clientes.html" class="active">

                        <i class="fa-solid fa-users"></i>

                        Clientes

                    </a>

                    <a href="#">

                        <i class="fa-solid fa-chart-pie"></i>

                        Relatórios

                    </a>

                </nav>

            </div>

            <button class="logout-btn" id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Sair

            </button>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <div class="topbar">

                <div>

                    <h1 class="page-title">
                        Clientes
                    </h1>

                    <p class="page-subtitle">
                        Gerencie os clientes da loja
                    </p>

                </div>

                <button class="btn-primary" id="btnNovoCliente">

                    <i class="fa-solid fa-plus"></i>

                    Novo cliente

                </button>

            </div>

            <!-- KPIS -->

            <div class="cards-grid">

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Total clientes
                        </span>

                        <h2 id="totalClientes">
                            0
                        </h2>

                    </div>

                    <i class="fa-solid fa-users card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Clientes ativos
                        </span>

                        <h2 id="clientesAtivos">
                            0
                        </h2>

                    </div>

                    <i class="fa-solid fa-user-check card-icon"></i>

                </div>

            </div>

            <!-- FILTRO -->

            <div class="filters-card">

                <input type="text" id="busca" class="filter-input" placeholder="Buscar cliente...">

                <button class="btn-primary" id="btnFiltrar">

                    <i class="fa-solid fa-filter"></i>

                    Filtrar

                </button>

            </div>

            <!-- TABELA -->

            <div class="table-card">

                <table class="custom-table">

                    <thead>

                        <tr>

                            <th>Nome</th>
                            <th>Telefone</th>
                            <th>CPF</th>
                            <th>Cidade</th>
                            <th>Compras</th>
                            <th>Cadastro</th>

                        </tr>

                    </thead>

                    <tbody id="tbodyClientes">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <!-- MODAL -->

    <div class="modal-overlay" id="modalCliente">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Novo cliente
                </h2>

                <button id="fecharModal">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <form id="formCliente">

                <div class="form-grid">

                    <input type="text" name="nome" placeholder="Nome" required>

                    <input type="text" name="telefone" placeholder="Telefone">

                    <input type="text" name="cpf" placeholder="CPF">

                    <input type="text" name="cidade" placeholder="Cidade">

                </div>

                <button type="submit" class="btn-primary full">

                    Salvar cliente

                </button>

            </form>

        </div>

    </div>

    <script src="../assets/js/clientes.js"></script>

</body>

</html>

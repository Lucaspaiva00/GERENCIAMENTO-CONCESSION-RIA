<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendedores</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="sidebar-logo">

                    <div class="sidebar-icon">

                        <i class="fa-solid fa-motorcycle"></i>

                    </div>

                    <span>
                        PAIVA TECH
                    </span>

                </div>

                <nav class="sidebar-menu">

                   <a href="../index.html">
                        <i class="fa-solid fa-chart-line"></i>
                        Dashboard
                    </a>

                    <a href="veiculos.html">
                        <i class="fa-solid fa-car-side"></i>
                        Veículos
                    </a>

                    <a href="vendas.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Vendas
                    </a>
                     <a href="vendedores.html" class="active">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Comissões
                    </a>

                    <a href="financeiro.html">
                        <i class="fa-solid fa-wallet"></i>
                        Financeiro
                    </a>

                    <a href="clientes.html">
                        <i class="fa-solid fa-users"></i>
                        Clientes
                    </a>

                    <a href="relatorios.html">
                        <i class="fa-solid fa-chart-pie"></i>
                        Relatórios
                    </a>

                    <a href="usuarios.html">
                        <i class="fa-solid fa-user"></i>
                        Cadastrar Vendedor
                    </a>

                </nav>

            </div>

            <button class="logout-btn" id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Sair

            </button>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <!-- TOPO -->

            <div class="topbar">

                <div>

                    <h1 class="page-title">
                        Vendedores
                    </h1>

                    <p class="page-subtitle">
                        Performance comercial da equipe
                    </p>

                </div>

            </div>

            <!-- KPIS -->

            <div class="cards-grid">

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Total vendedores
                        </span>

                        <h2 id="kpiVendedores">
                            0
                        </h2>

                    </div>

                    <i class="fa-solid fa-users card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Total vendido
                        </span>

                        <h2 id="kpiVendido">
                            R$ 0,00
                        </h2>

                    </div>

                    <i class="fa-solid fa-sack-dollar card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Comissões
                        </span>

                        <h2 id="kpiComissao">
                            R$ 0,00
                        </h2>

                    </div>

                    <i class="fa-solid fa-money-bill-wave card-icon"></i>

                </div>

                <div class="dashboard-card">

                    <div>

                        <span class="card-label">
                            Melhor vendedor
                        </span>

                        <h2 id="kpiMelhor">
                            -
                        </h2>

                    </div>

                    <i class="fa-solid fa-trophy card-icon"></i>

                </div>

            </div>

            <!-- GRÁFICO -->

            <div class="chart-card mb-20">

                <h3>
                    Ranking de vendas
                </h3>

                <canvas id="rankingChart"></canvas>

            </div>

            <!-- TABELA -->

            <div class="table-card">

                <table class="custom-table">

                    <thead>

                        <tr>

                            <th>Vendedor</th>
                            <th>Vendas</th>
                            <th>Total vendido</th>
                            <th>Comissão</th>
                            <th>Ticket médio</th>

                        </tr>

                    </thead>

                    <tbody id="tbodyVendedores">

                    </tbody>

                </table>

            </div>

        </main>

    </div>

    <script src="../assets/js/vendedores.js"></script>

</body>

</html>
